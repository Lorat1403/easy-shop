<div class="info-container">
  <h2 class="info-container__title">Enter to Easy Shop</h2>
  <div class="info-container__card">
    <form (ngSubmit)="onLogin()">
      <div class="field-group">
        <label for="email">Email*</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required />
      </div>
      <div class="field-group">
        <label for="password">Password*</label>
        <input type="password" [(ngModel)]="pass" name="pass" placeholder="Password" required />
      </div>
      <button type="submit" class="all-btn all-btn__submit">Login</button>
    </form>
    <div class="social-login">
      <div class="divider"><span>or</span></div>

      <button type="button" class="google-auth-btn" (click)="signInWithGoogle()">
        <img src="/google.svg" alt="Google" referrerpolicy="no-referrer" />
        Continue with Google
      </button>
    </div>

    @if (error) {
      <p class="error-msg">{{ error }}</p>
    }
  </div>
  <p class="switch-auth">Don't have an account? <a routerLink="/register">Register now</a></p>
</div>
